[files]
l2_dir = "tropomi/l2/"
grid_dir = "tropomi/gridded/"
plot_dir = "tropomi/plots/"

[defaults]
box_width = 10.0

[products.no2]
# Must specify version, or we get both the v1 and v2 NO2 products
provider = "earthaccess"
filters = { short_name = "S5P_L2__NO2____HiR", version = "2" }

[products.co]
# Must specify version, or we get both the v1 and v2 CO products,
# and v1 doesn't include the a priori
provider = "earthaccess"
filters = { short_name = "S5P_L2__CO_____HiR", version = "2" }

[products.no2_prior]
provider = "tropomi-priors-eodata"
filters = { Prefix = "Sentinel-5P/AUX/AUX_CTMANA/{date:%Y}/{date:%m}/{date:%d}/" }
subset_vars = ["lon", "lat", "date", "hyam", "hyai", "hybm", "hybi", "ps", "no2"]

[products.goes_fire]
provider = "goes-s3fs"
hour_path_template = "noaa-goes16/ABI-L2-FDCC/{date:%Y}/{date:%j}/{date:%H}/"

